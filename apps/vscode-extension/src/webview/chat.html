<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{CSP_SOURCE}} 'unsafe-inline'; script-src {{CSP_SOURCE}} 'unsafe-inline' 'nonce-{{NONCE}}';">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: var(--vscode-font-family);
            background: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            height: 100vh;
            overflow: hidden;
        }

        #menu,
        #chat-screen {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #chat-screen {
            display: none;
        }

        .header {
            padding: 12px;
            border-bottom: 1px solid #444;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            font-size: 20px;
            cursor: pointer;
            padding: 0 8px;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
        }

        .user {
            align-self: flex-end;
            background: #007acc;
            color: white;
        }

        .assistant {
            align-self: flex-start;
            background: #2d2d2d;
        }

        .chat-item {
            padding: 12px;
            cursor: pointer;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .chat-item:hover {
            background: #2d2d2d;
        }

        #input-area {
            padding: 12px;
            border-top: 1px solid #444;
            display: flex;
            gap: 8px;
        }

        #prompt {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            background: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border: none;
        }

        button {
            padding: 10px 20px;
            border-radius: 20px;
            background: #007acc;
            color: white;
            border: none;
            cursor: pointer;
        }

        #read-file {
            padding: 8px 12px;
            background: #2d2d2d;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>

</head>

<body>

    <div id="menu">
        <div class="header">
            <h3>Chats</h3>
        </div>

        ```
        <button onclick="newChat()" style="margin:12px;width:calc(100% - 24px);">
            + New Chat
        </button>

        <div id="chat-list" style="padding:0 12px;"></div>
        ```

    </div>

    <div id="chat-screen">

        ```
        <div class="header">
            <span class="back-btn" onclick="showMenu()">
                ←
            </span>

            <h3 id="chat-title">Chat</h3>

            <button onclick="deleteCurrentChat()"
                style="margin-left:auto; background:#ff5555; padding:5px 10px; font-size:12px;">
                🗑️ Delete
            </button>
        </div>

        <div id="chat-container"></div>

        <div id="input-area">
            <textarea id="prompt" rows="1" placeholder="Type a message..."></textarea>

            <button id="send">
                Send
            </button>

            <button id="read-file" title="Read active file">
                📄
            </button>
        </div>
        ```

    </div>

    <script nonce="{{NONCE}}" src="{{SCRIPT_URI}}"></script>

</body>

</html>
